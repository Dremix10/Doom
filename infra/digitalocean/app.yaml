# DigitalOcean App Platform spec: the Doom API (Docker) + the web PWA (static site),
# both served over HTTPS. Deploy: doctl apps create --spec infra/digitalocean/app.yaml
# (or paste in the App Platform UI). Set the secret values in the dashboard after.
name: nudge
region: nyc

services:
  - name: api
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    github:
      repo: Dremix10/Doom
      branch: main
      deploy_on_push: true
    http_port: 8000
    instance_size_slug: basic-xxs
    instance_count: 1
    health_check:
      http_path: /health
    envs:
      - key: APP_NAME
        value: Doom
      - key: PUBLIC_API_URL
        value: ${APP_URL}
      # Notifications (Web Push). Generate with: python -m app.tools.vapid
      # Add these as SECRET-type env vars in the dashboard:
      #   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT
      # Optional integrations (also secrets):
      #   GEMINI_API_KEY, ELEVENLABS_API_KEY, DATABASE_URL, ADGUARD_*, TWILIO_*

static_sites:
  - name: web
    source_dir: app
    github:
      repo: Dremix10/Doom
      branch: main
      deploy_on_push: true
    # Expo web export. public/index.html already carries the PWA + service-worker
    # tags, so no post-step is needed.
    build_command: npm ci && npx expo export --platform web
    output_dir: dist
    envs:
      - key: EXPO_PUBLIC_API_URL
        value: ${api.PUBLIC_URL}   # point the app at the API component
